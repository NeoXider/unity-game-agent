<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="480" rx="24" fill="#0f172a"/>
  <text x="60" y="64" fill="#f8fafc" font-size="30" font-weight="700">Several projects on one machine</text>
  <text x="60" y="96" fill="#94a3b8" font-size="17">Every project has its own Editor, broker, leases and queues. Shared Editor preferences are reference-counted.</text>

  <g font-size="15">
    <rect x="60" y="130" width="330" height="220" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="225" y="166" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle">Project A</text>
    <text x="90" y="200" fill="#e2e8f0">Unity Editor + broker</text>
    <text x="90" y="226" fill="#cbd5e1">agents: code-1, code-2, ui-1, qa</text>
    <text x="90" y="252" fill="#cbd5e1">Library/UgaBroker/state.json</text>
    <text x="90" y="278" fill="#cbd5e1">UGA_PROJECT_ROOT = A</text>
    <text x="90" y="304" fill="#cbd5e1">MCP pinned to A</text>

    <rect x="435" y="130" width="330" height="220" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="600" y="166" fill="#a78bfa" font-size="20" font-weight="700" text-anchor="middle">Project B</text>
    <text x="465" y="200" fill="#e2e8f0">Unity Editor + broker</text>
    <text x="465" y="226" fill="#cbd5e1">agents: level, art, qa</text>
    <text x="465" y="252" fill="#cbd5e1">Library/UgaBroker/state.json</text>
    <text x="465" y="278" fill="#cbd5e1">UGA_PROJECT_ROOT = B</text>
    <text x="465" y="304" fill="#cbd5e1">MCP pinned to B</text>

    <rect x="810" y="130" width="330" height="220" rx="18" fill="#111827" stroke="#facc15" stroke-width="2.5"/>
    <text x="975" y="166" fill="#facc15" font-size="20" font-weight="700" text-anchor="middle">Machine</text>
    <text x="840" y="200" fill="#e2e8f0">broker registry</text>
    <text x="840" y="226" fill="#cbd5e1">editor-broker.ps1 projects</text>
    <text x="840" y="262" fill="#e2e8f0">Editor preferences (per user)</text>
    <text x="840" y="288" fill="#cbd5e1">first session backs up,</text>
    <text x="840" y="312" fill="#cbd5e1">last session restores</text>
  </g>
  <rect x="60" y="380" width="1080" height="70" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="90" y="412" fill="#f8fafc" font-size="16" font-weight="700">No shared locks between projects:</text>
  <text x="90" y="436" fill="#cbd5e1" font-size="15">the same agent names and the same folder leases in A and B never block each other; doctor warns when free RAM runs low.</text>
</svg>
