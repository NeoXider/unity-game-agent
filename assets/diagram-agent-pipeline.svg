<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" rx="24" fill="#0f172a"/>
  <text x="60" y="64" fill="#f8fafc" font-size="30" font-weight="700">Orchestrator and subagents</text>
  <text x="60" y="96" fill="#94a3b8" font-size="17">One brief per work item. Developer builds, an independent QA proves it, defects loop back.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
  </defs>

  <rect x="60" y="140" width="220" height="110" rx="16" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
  <text x="170" y="182" fill="#facc15" font-size="20" font-weight="700" text-anchor="middle">Orchestrator</text>
  <text x="170" y="208" fill="#cbd5e1" font-size="14" text-anchor="middle">intake · mode · pattern</text>
  <text x="170" y="230" fill="#cbd5e1" font-size="14" text-anchor="middle">readiness check · leases</text>

  <rect x="340" y="120" width="200" height="64" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="440" y="158" fill="#a78bfa" font-size="17" font-weight="700" text-anchor="middle">Game Designer</text>
  <rect x="340" y="206" width="200" height="64" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="440" y="244" fill="#f472b6" font-size="17" font-weight="700" text-anchor="middle">Designer · Lead</text>
  <text x="440" y="298" fill="#94a3b8" font-size="13" text-anchor="middle">only for real gaps</text>

  <rect x="600" y="160" width="190" height="92" rx="16" fill="#0c2f4a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="695" y="196" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">Brief</text>
  <text x="695" y="222" fill="#e0f2fe" font-size="13" text-anchor="middle">scope · reuse receipt</text>
  <text x="695" y="240" fill="#e0f2fe" font-size="13" text-anchor="middle">leases · checks</text>

  <rect x="850" y="120" width="290" height="74" rx="16" fill="#0b3b2e" stroke="#34d399" stroke-width="2.5"/>
  <text x="995" y="152" fill="#34d399" font-size="19" font-weight="700" text-anchor="middle">Developer</text>
  <text x="995" y="176" fill="#d1fae5" font-size="13" text-anchor="middle">smallest change · reuse first · source-final</text>
  <rect x="850" y="230" width="290" height="74" rx="16" fill="#3b1d0b" stroke="#fb923c" stroke-width="2.5"/>
  <text x="995" y="262" fill="#fb923c" font-size="19" font-weight="700" text-anchor="middle">Independent QA</text>
  <text x="995" y="286" fill="#ffedd5" font-size="13" text-anchor="middle">drives the real behavior · captures · tests</text>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M280 195 L340 152"/>
    <path d="M280 195 L340 238"/>
    <path d="M540 152 L600 190"/>
    <path d="M540 238 L600 220"/>
    <path d="M790 190 L850 157"/>
    <path d="M995 194 L995 230"/>
  </g>
  <path d="M1140 267 C 1180 267, 1180 157, 1140 157" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <text x="1150" y="215" fill="#f87171" font-size="13">defect</text>

  <rect x="850" y="340" width="290" height="60" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="995" y="376" fill="#bbf7d0" font-size="18" font-weight="700" text-anchor="middle">Ship · auto-advance</text>
  <path d="M995 304 L995 340" stroke="#4ade80" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="60" y="430" width="1080" height="96" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="90" y="466" fill="#f8fafc" font-size="17" font-weight="700">Several subagents at once</text>
  <text x="90" y="494" fill="#cbd5e1" font-size="15">Each gets its own brief and non-overlapping leases. They share one Unity Editor through the broker;</text>
  <text x="90" y="516" fill="#cbd5e1" font-size="15">two failed attempts on a check end in a concise blocker instead of an endless retry loop.</text>
</svg>
